
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrafficAI | Sign Up</title>

  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body>

  <div class="container-fluid">
    <div class="row auth-wrapper">

      <!-- Signup Form -->
      <div class="col-lg-6 auth-form-side d-flex align-items-center justify-content-center py-5 order-2 order-lg-1">
        <div class="w-100 px-3" style="max-width: 440px;">

          <a href="../index.html" class="auth-logo d-block mb-4">
            <i class="bi bi-signpost-split-fill"></i> TrafficAI
          </a>

          <h3 class="fw-bold">Create Your Account</h3>
          <p class="text-muted">
            Get started with the TrafficAI platform.
          </p>

          <form action="login.html" method="get">

            <div class="row g-3 mb-3">

              <div class="col-sm-6">
                <label for="first" class="form-label">First Name</label>
                <input type="text" class="form-control"
                  id="first" name="first"
                  placeholder="Juan" required>
              </div>

              <div class="col-sm-6">
                <label for="last" class="form-label">Last Name</label>
                <input type="text" class="form-control"
                  id="last" name="last"
                  placeholder="Dela Cruz" required>
              </div>

            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control"
                id="email" name="email"
                placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Account Role</label>
              <select class="form-select" id="role" name="role" required>
                <option value="" selected disabled>Choose your role...</option>
                <option value="administrator">Administrator</option>
                <option value="researcher">Researcher</option>
                <option value="viewer">Viewer</option>
              </select>
            </div>

            <div class="row g-3 mb-3">

              <div class="col-sm-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control"
                  id="password" name="password"
                  placeholder="Password" minlength="8" required>
              </div>

              <div class="col-sm-6">
                <label for="confirm" class="form-label">Confirm Password</label>
                <input type="password" class="form-control"
                  id="confirm" name="confirm"
                  placeholder="Confirm password" minlength="8" required>
              </div>

            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox"
                id="terms" required>
              <label class="form-check-label" for="terms">
                I agree to the <a href="#">Terms &amp; Conditions</a>
              </label>
            </div>

            <button type="submit" class="btn btn-brand w-100 py-2">
              <i class="bi bi-person-plus me-1"></i>
              Create Account
            </button>

          </form>

          <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="login.html" class="text-brand fw-semibold">Login</a>
          </p>

          <p class="text-center text-muted small mt-4">
            AI-Based Traffic Congestion Prediction and Signal Optimization
          </p>

        </div>
      </div>

      <!-- Image Side -->
      <div class="col-lg-6 auth-image signup d-flex align-items-end p-5 order-1 order-lg-2">
        <div class="text-white">
          <span class="hero-label">Smarter Transportation</span>
          <h2 class="fw-bold mt-3">Join the Journey.</h2>
          <p class="mb-0">
            Explore a smarter approach to traffic congestion
            prediction and signal optimization.
          </p>
        </div>
      </div>

    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
